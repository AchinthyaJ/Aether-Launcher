name: Release Fugo Launcher

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Run Linux packaging script
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./package_linux.sh
          ./package_linux.sh

      - name: Generate checksums for Linux artifacts
        run: |
          cd dist
          sha256sum fugo-launcher_*.deb > checksums-linux.txt
          cat checksums-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/fugo-launcher_*.deb
            dist/checksums-linux.txt
          retention-days: 1

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install NSIS
        run: |
          choco install nsis -y
          & "C:\Program Files (x86)\NSIS\makensis.exe" -VERSION

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Run Windows packaging script
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          chmod +x ./package_windows.sh
          ./package_windows.sh

      - name: Generate checksums for Windows artifacts
        shell: bash
        run: |
          cd dist
          if [ -f windows-x64/setup.exe ]; then
            sha256sum windows-x64/setup.exe > checksums-windows.txt
          fi
          if [ -f windows-x64/FugoLauncher.exe ]; then
            sha256sum windows-x64/FugoLauncher.exe >> checksums-windows.txt
          fi
          if [ -s checksums-windows.txt ]; then
            cat checksums-windows.txt
          else
            echo "No Windows artifacts found to checksum"
          fi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/windows-x64/setup.exe
            dist/windows-x64/FugoLauncher.exe
            dist/checksums-windows.txt
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Artifacts Downloaded ==="
          find artifacts -type f | sort

      - name: Create combined checksums file
        run: |
          {
            echo "# Fugo Launcher ${{ steps.version.outputs.version }} - Checksums"
            echo ""
            if [ -f artifacts/linux-packages/checksums-linux.txt ]; then
              echo "## Linux Packages"
              cat artifacts/linux-packages/checksums-linux.txt
              echo ""
            fi
            if [ -f artifacts/windows-packages/checksums-windows.txt ]; then
              echo "## Windows Packages"
              cat artifacts/windows-packages/checksums-windows.txt
              echo ""
            fi
          } > checksums.txt
          cat checksums.txt

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Fugo Launcher ${{ steps.version.outputs.version }}
          body: |
            ## Fugo Launcher ${{ steps.version.outputs.version }}

            ### Release Artifacts
            - **Linux**: `.deb` packages for amd64 and arm64 architectures
            - **Windows**: Standalone executable and/or installer

            ### Installation

            **Windows:**
            - Download `setup.exe` or `FugoLauncher.exe` (portable)
            - Run the installer or executable

            **Linux:**
            ```bash
            sudo dpkg -i fugo-launcher_${{ steps.version.outputs.version }}_amd64.deb
            ```

            ### Verification
            Verify file integrity using the `checksums.txt` file:
            ```bash
            sha256sum -c checksums.txt
            ```

            ---
            *For detailed release notes, see the commit history.*
          draft: false
          prerelease: false

      - name: Upload Linux .deb packages
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux-packages/fugo-launcher_${{ steps.version.outputs.version }}_amd64.deb
          asset_name: fugo-launcher_${{ steps.version.outputs.version }}_amd64.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Linux arm64 .deb package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux-packages/fugo-launcher_${{ steps.version.outputs.version }}_arm64.deb
          asset_name: fugo-launcher_${{ steps.version.outputs.version }}_arm64.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload Windows setup.exe
        if: hashFiles('artifacts/windows-packages/setup.exe') != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows-packages/setup.exe
          asset_name: FugoLauncher-${{ steps.version.outputs.version }}-Setup.exe
          asset_content_type: application/x-executable

      - name: Upload Windows portable executable
        if: hashFiles('artifacts/windows-packages/FugoLauncher.exe') != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows-packages/FugoLauncher.exe
          asset_name: FugoLauncher-${{ steps.version.outputs.version }}-Portable.exe
          asset_content_type: application/x-executable

      - name: Upload checksums
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: checksums.txt
          asset_name: checksums.txt
          asset_content_type: text/plain
